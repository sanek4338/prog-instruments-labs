[project]
name = "lab1-birthdate-filter"
version = "0.1.0"
requires-python = ">=3.10"

# ========== Ruff: линтер ==========
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ========== Ruff: форматтер ==========
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ========== Pyright ==========
[tool.pyright]
include = ["uno.py", "tests"]
exclude = [".venv", "__pycache__"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.10"